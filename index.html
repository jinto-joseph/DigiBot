<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DigiBuddy - Digital Literacy Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="bot-avatar">
      <svg width="60" height="60" viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#4A90E2"/><ellipse cx="32" cy="40" rx="18" ry="12" fill="#fff"/><ellipse cx="24" cy="32" rx="4" ry="6" fill="#222"/><ellipse cx="40" cy="32" rx="4" ry="6" fill="#222"/><ellipse cx="32" cy="46" rx="8" ry="4" fill="#eaf6ff"/></svg>
    </div>
    <h1>DigiBuddy</h1>
    <p>Your friendly guide to the digital world</p>
    <div class="lang-voice">
      <select id="lang-select">
        <option value="en">English</option>
        <option value="hi">हिंदी</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
      </select>
      <button id="voice-btn" title="Voice Input">🎤</button>
    </div>
  </header>
  <main>
    <div class="quick-actions">
      <button onclick="quickAction('What is a browser?')">Learn Basics</button>
      <button onclick="quickAction('How can I set up an email account?')">Email Setup</button>
      <button onclick="quickAction('Why isnt my phone connecting to Wi-Fi?')">Wi-Fi Help</button>
      <button onclick="quickAction('How to use WhatsApp?')">WhatsApp Guide</button>
      <button onclick="quickAction('Give me a tech tip!')">Tech Tips</button>
    </div>
    <div class="chat-container" id="chat-container">
      <div class="chat-messages" id="chat-messages">
        <div class="message bot-message">
          <span class="bot-avatar-inline"><svg width="28" height="28" viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#4A90E2"/><ellipse cx="32" cy="40" rx="18" ry="12" fill="#fff"/><ellipse cx="24" cy="32" rx="4" ry="6" fill="#222"/><ellipse cx="40" cy="32" rx="4" ry="6" fill="#222"/><ellipse cx="32" cy="46" rx="8" ry="4" fill="#eaf6ff"/></svg></span>
          Hello! I'm DigiBuddy, your tech-savvy buddy. Let's master the digital world together! 😊<br>
          <small>Try asking: "What is a browser?" or "How do I pay bills online?"</small>
        </div>
      </div>
      <div class="input-container">
        <input type="text" id="user-input" placeholder="Type your question here..." aria-label="Type your question">
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </main>
  <footer>
    <p>Made with ❤️ for digital learners. <a href="#" target="_blank">About</a></p>
  </footer>
  <script src="main.js"></script>
</body>
</html>
